[package]
name = "localmt-cli"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "localmt"
path = "src/main.rs"
doc = false

[dependencies]
localmt = { path = "../localmt" }
localmt-bench = { path = "../localmt-bench" }
localmt-ffi = { path = "../localmt-ffi" }
localmt-models = { path = "../localmt-models" }

[features]
default = []
hf-tokenizers = ["localmt/hf-tokenizers", "localmt-ffi/hf-tokenizers"]
llama-runtime = ["localmt/llama-runtime", "localmt-ffi/llama-runtime"]
ort-runtime = ["localmt/ort-runtime", "localmt-ffi/ort-runtime"]

[lints]
workspace = true
