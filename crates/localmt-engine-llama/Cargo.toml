[package]
name = "localmt-engine-llama"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
localmt-core = { path = "../localmt-core" }
localmt-engine = { path = "../localmt-engine" }
localmt-models = { path = "../localmt-models" }
libloading = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
llama-runtime = ["dep:libloading"]

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
