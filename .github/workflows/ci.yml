name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - name: Format
        run: cargo fmt --all --check

      - name: Test default features
        run: cargo test --locked

      - name: Test all features
        run: cargo test --locked --all-features

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps

      - name: Android arm64 FFI check
        run: cargo check --locked -p localmt-ffi --target aarch64-linux-android

      - name: Android JNI smoke syntax
        run: |
          JAVA_HOME_DIR="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          c++ -std=c++17 -fsyntax-only \
            -Icrates/localmt-ffi/include \
            -Iexamples/android-jni-smoke/src/main/cpp \
            -I"$JAVA_HOME_DIR/include" \
            -I"$JAVA_HOME_DIR/include/linux" \
            examples/android-jni-smoke/src/main/cpp/localmt_jni_smoke.cpp
          c++ -std=c++17 \
            -Iexamples/android-jni-smoke/src/main/cpp \
            -I"$JAVA_HOME_DIR/include" \
            -I"$JAVA_HOME_DIR/include/linux" \
            examples/android-jni-smoke/tests/localmt_jni_utf_test.cpp \
            -o /tmp/localmt-jni-utf-test
          /tmp/localmt-jni-utf-test
          javac -d /tmp/localmt-jni-smoke-classes \
            examples/android-jni-smoke/src/main/java/dev/localmt/smoke/LocalmtNative.java
          cargo run --locked -p localmt-cli -- ffi startup > /tmp/localmt-startup.txt
          ruby examples/android-jni-smoke/tests/check_java_language_constants.rb \
            examples/android-jni-smoke/src/main/java/dev/localmt/smoke/LocalmtNative.java \
            /tmp/localmt-startup.txt

      - name: Release FFI symbol check
        run: |
          cargo build --locked --release -p localmt-ffi --features hf-tokenizers,ort-runtime
          test -f target/release/liblocalmt_ffi.so
          nm -D --defined-only target/release/liblocalmt_ffi.so | grep -q localmt_ffi_abi_version
          nm -D --defined-only target/release/liblocalmt_ffi.so | grep -q localmt_ffi_model_pack_trust_schema_version
